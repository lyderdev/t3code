name: Deploy LD Code to GitHub Pages

# Publishes the web client as a static app at the project-site URL. The app pairs
# with a T3 server from Settings → Connections; it has no backend of its own here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...

      - id: pages
        name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          T3CODE_WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_HOSTED_APP_URL: ${{ steps.pages.outputs.base_url }}
          VITE_RELEASE_CHANNEL: preview
          T3CODE_WEB_SOURCEMAP: "0"
        run: |
          set -euo pipefail
          vp run --filter @t3tools/web build
          # Pages answers unknown paths with 404.html; serving the shell there
          # lets the client-side router resolve deep links.
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to Pages
        uses: actions/deploy-pages@v4
